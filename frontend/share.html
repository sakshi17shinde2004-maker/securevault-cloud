<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared file - SecureVault Cloud</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container"><div class="card auth-card shadow-sm"><div class="card-body p-4 text-center">
  <h1 class="h5 brand mb-3">SecureVault Cloud</h1>
  <div id="msg" class="text-muted">Checking link…</div>
  <div id="box" class="d-none">
    <p class="mb-1 fw-semibold" id="fname"></p>
    <p class="small text-muted" id="fmeta"></p>
    <button id="go" class="btn btn-sv"></button>
  </div>
</div></div></div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const msg = document.getElementById('msg'), box = document.getElementById('box');
let info = null;
(async () => {
  try {
    const r = await fetch('/api/share/' + encodeURIComponent(token));
    if (!r.ok) throw new Error((await r.json()).detail || 'Invalid link');
    info = await r.json();
    document.getElementById('fname').textContent = info.name;
    document.getElementById('fmeta').textContent =
      (info.size / 1024).toFixed(1) + ' KB · expires ' + new Date(info.expires_at + 'Z').toLocaleString();
    document.getElementById('go').textContent = info.permission === 'view' ? 'Open file' : 'Download file';
    msg.classList.add('d-none'); box.classList.remove('d-none');
  } catch (e) { msg.textContent = e.message; msg.className = 'text-danger'; }
})();
document.getElementById('go').onclick = async () => {
  const r = await fetch('/api/share/' + encodeURIComponent(token) + '/content');
  if (!r.ok) { msg.textContent = (await r.json()).detail; msg.className = 'text-danger'; msg.classList.remove('d-none'); return; }
  const url = URL.createObjectURL(await r.blob());
  if (info.permission === 'view') { window.open(url, '_blank'); return; }
  const a = document.createElement('a'); a.href = url; a.download = info.name; a.click();
};
</script>
</body>
</html>
